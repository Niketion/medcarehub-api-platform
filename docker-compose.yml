name: medcarehub

services:
  postgres:
    image: postgres:16
    container_name: medcarehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcarehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medcarehub"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: medcarehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak-db:
    image: postgres:16
    container_name: medcarehub-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: medcarehub-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-medcarehub.json:/opt/keycloak/data/import/realm-medcarehub.json:ro

  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    pull_policy: always
    container_name: medcarehub-api-tests
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      PG_IT_CONNECTIONSTRING: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
    command: ["dotnet", "test", "tests/MedCareHub.Api.Tests/MedCareHub.Api.Tests.csproj"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/src/MedCareHub.Api/Dockerfile
      pull: true
    container_name: medcarehub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api-tests:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=medcarehub;Username=postgres;Password=postgres
      Auth__Authority: http://keycloak:8080/realms/medcarehub
      Auth__ValidateAudience: "false"
      Auth__ValidateIssuer: "false"
      Cors__AllowedOrigins__0: http://localhost:4200
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Storage__Bucket: reports
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      pull: true
    container_name: medcarehub-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "4200:80"
    environment:
      API_BASE_URL: "/api"
      KEYCLOAK_URL: "http://localhost:8081"
      KEYCLOAK_REALM: "medcarehub"
      KEYCLOAK_CLIENT_ID: "medcarehub-web"

volumes:
  pg-data:
  minio-data:
  keycloak-pg-data: