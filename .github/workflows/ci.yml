name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (.NET + PostgreSQL tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    env:
      PG_IT_CONNECTIONSTRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend test project
        run: dotnet restore tests/MedCareHub.Api.Tests/MedCareHub.Api.Tests.csproj

      - name: Build backend test project
        run: dotnet build tests/MedCareHub.Api.Tests/MedCareHub.Api.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/MedCareHub.Api.Tests/MedCareHub.Api.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Angular build + tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build
